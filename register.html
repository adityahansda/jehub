<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Jharkhand Engineer's Hub</title>
    <link rel="stylesheet" href="styles/Login.css">

</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="assets/jharkhand_Enginner_s_Hub-white.png" alt="">
        </div>
        <h2>Register</h2>
        <input type="email" placeholder="Email" required>
        <input type="tel" placeholder="Phone Number" required>
        <input type="password" placeholder="Password" required>
        <button>Register</button>
        <div class="forgot-password">Forgot password?</div>
        <div class="account-info">already have an account</div>
        <div class="divider">
            <span>Or</span>
        </div>
        <button class="google-button"> <img src="assets/google.png " alt="">Continue With Google</button>
        <p>© 2024 Jharkhand Engineer's Hub</p>
    </div>
</body>

</html>
