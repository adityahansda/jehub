<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Jharkhand Engineer's Hub</title>
    <link rel="stylesheet" href="styles/Login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.19.1/TweenMax.min.js"></script>
    <script type="text/javascript" src="cssanimation-gsap.js"></script>

</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="assets/jharkhand_Enginner_s_Hub-white.png" alt="">
        </div>
        <h2>Login</h2>
        <input type="email" placeholder="Email" required>
        <input type="tel" placeholder="Phone Number" required>
        <input type="password" placeholder="Password" required>
        <button>Register</button>
        <div class="forgot-password"><a>Forgot password?</a></div>
        <div class="account-info"><a href="register.html">Don't have an account</a></div>
        <div class="divider">
            <span>Or</span>
        </div>
        <button class="google-button"> <img src="assets/google.png " alt="">Continue With Google</button>
        <p>© 2024 Jharkhand Engineer's Hub</p>
    </div>
</body>

</html>
